name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # database.g.dart is committed; fail if it's stale.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code lib/data/database.g.dart
      - run: flutter analyze
      # Integration tests skip themselves without Supabase credentials.
      - run: flutter test
